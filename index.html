<style>/* Tap changers, part by part. A calm studio: the model on a soft lit floor, quiet chrome around it, one blue for selection. */
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/plex-mono-500.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:600;font-display:swap;src:url(fonts/plex-mono-600.woff2) format("woff2")}
:root{
  --paper:#f4f4f2;--surface:#fff;--fill:#f2f2f0;--fill-2:#e8e8e5;--ink:#1f1f1e;--ink-2:#4b4a47;--ink-3:#6b6a66;--rule:#ebebe8;--rule-2:#dcdbd7;
  --accent:#2563eb;--accent-text:#1d4ed8;--accent-ink:#fff;--accent-tint:#eaf1fe;
  --ok:#1a7f45;--ok-tint:#e9f5ee;--bad:#c2352b;--bad-tint:#fdecea;
  --stage:radial-gradient(120% 95% at 50% 36%,#fff 0%,#f6f6f4 46%,#e9e9e5 100%);
  --glass:color-mix(in srgb,var(--surface) 80%,transparent);
  --ring:0 0 0 1px rgba(15,15,15,.07);
  --shadow-1:0 1px 2px rgba(15,15,15,.06),var(--ring);
  --shadow-2:0 1px 2px rgba(15,15,15,.04),0 10px 30px -12px rgba(15,15,15,.18),var(--ring);
  --shadow-3:0 2px 6px rgba(15,15,15,.05),0 30px 80px -24px rgba(15,15,15,.32),var(--ring);
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.4,.64,1);
  --bar:56px;--panel:clamp(400px,33vw,500px);
  interpolate-size:allow-keywords;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#111214;--surface:#18191b;--fill:#222326;--fill-2:#2b2c30;--ink:#ededeb;--ink-2:#c2c1bd;--ink-3:#9a9994;--rule:#26272a;--rule-2:#36373b;
  --accent:#6b9bff;--accent-text:#93b5ff;--accent-ink:#0b1224;--accent-tint:#1c2a47;
  --ok:#5cc489;--ok-tint:#15291e;--bad:#ff8a80;--bad-tint:#33191a;
  --stage:radial-gradient(120% 95% at 50% 36%,#2a2c30 0%,#1a1b1e 48%,#101113 100%);
  --ring:0 0 0 1px rgba(255,255,255,.07);
  --shadow-1:0 1px 2px rgba(0,0,0,.4),var(--ring);
  --shadow-2:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.6),var(--ring);
  --shadow-3:0 2px 6px rgba(0,0,0,.3),0 30px 80px -20px rgba(0,0,0,.7),var(--ring);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--surface);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:"cv11","ss01"}
::selection{background:var(--accent-tint);color:var(--ink)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-feature-settings:"zero" 0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:12px;top:-100px;z-index:20;background:var(--surface);padding:8px 12px;border-radius:8px;box-shadow:var(--shadow-2)}
.skip:focus{top:10px}
*{scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
/* press feedback on every control */
.tool,.btn,.icon,.seg button,.fam-btn,.dot,.opt{transition:background-color .15s,color .15s,border-color .15s,box-shadow .15s,transform .12s var(--out)}
.tool:active,.btn:active:not(:disabled),.icon:active:not(:disabled),.seg button:active,.fam-btn:active,.dot:active,.opt:active:not(:disabled){transform:scale(.96)}

/* top bar */
.bar{height:var(--bar);display:flex;align-items:center;gap:14px;padding:0 14px 0 20px;border-bottom:1px solid var(--rule);background:var(--surface);position:relative;z-index:6}
.brand{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.fam-btn{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px 0 12px;border:0;border-radius:9px;background:var(--fill);cursor:pointer;max-width:min(440px,48vw)}
.fam-btn:hover{background:var(--fill-2)}
.fam-btn b{font:600 14px/1 var(--mono);white-space:nowrap;flex:none}
.fam-btn span{font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fam-btn svg{color:var(--ink-3)}
.fam-btn svg,.icon svg{flex:none;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bar-tools{margin-left:auto;display:flex;align-items:center;gap:6px}
/* segmented control: a track with one raised pill that slides to the pressed cell (--n cells, --i pressed; set in app.mjs) */
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:10px;background:var(--fill);isolation:isolate}
.seg::before{content:"";position:absolute;z-index:-1;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n,1));border-radius:7px;background:var(--surface);box-shadow:var(--shadow-1);transform:translateX(calc(100% * var(--i,0)));transition:transform .32s var(--out)}
:root[data-theme="dark"] .seg::before{background:#34353a}
.seg:not([style*="--i"])::before{opacity:0}
.seg button{position:relative;border:0;background:none;padding:0 12px;min-height:30px;min-width:42px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--ink-3);border-radius:7px}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.seg button:not([aria-pressed="true"]):hover{color:var(--ink)}
.icon{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:9px;background:none;cursor:pointer;color:var(--ink-2)}
.icon:hover{background:var(--fill);color:var(--ink)}

/* type picker: one card per type, the model itself on a lit floor, then the code and the facts that tell types apart */
#fam-dlg{border:0;padding:0;margin:calc(var(--bar) + 10px) auto auto;width:min(1140px,calc(100vw - 32px));max-height:calc(100svh - var(--bar) - 28px);border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-3);overflow:hidden;display:none;flex-direction:column}
#fam-dlg[open]{display:flex;animation:drop .32s var(--out)}
#fam-dlg::backdrop{background:rgba(15,15,15,.28);backdrop-filter:blur(6px);animation:fade-in .25s ease}
@keyframes drop{from{opacity:0;transform:translateY(-10px) scale(.98)}}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px 24px;flex:none}
.dlg-head h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.fam-grid{overflow-y:auto;overscroll-behavior:contain;padding:0 24px 28px}
.fam-group{padding:16px 0 4px}
.fam-group h2{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--ink-3)}
.fam-group ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
#fam-dlg[open] .fam-group li{animation:rise-in .5s var(--out) both;animation-delay:calc(var(--i,0) * 18ms + 40ms)}
.fam-item{display:flex;flex-direction:column;width:100%;height:100%;padding:0;text-align:left;border:0;background:var(--surface);border-radius:12px;cursor:pointer;overflow:hidden;box-shadow:var(--shadow-1);transition:box-shadow .25s var(--out),transform .25s var(--out)}
.fam-item:hover{box-shadow:var(--shadow-2);transform:translateY(-3px)}
.fam-item:active{transform:translateY(-1px) scale(.985)}
.fam-item[aria-current="true"]{box-shadow:0 0 0 2px var(--accent),var(--shadow-2)}
.fam-pic{display:block;flex:none;height:160px;padding:14px 10px 10px;background:var(--stage)}
.fam-pic img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(0,0,0,.14));transition:transform .45s var(--out)}
.fam-item:hover .fam-pic img{transform:scale(1.06) translateY(-2px)}
.fam-text{display:flex;flex-direction:column;gap:3px;flex:1;padding:12px 14px 14px}
.fam-text>b{font:600 15px/1.25 var(--mono)}
.fam-kind{font-size:13.5px;color:var(--ink-2);line-height:1.4;text-wrap:pretty}
.fam-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:10px}
.fam-tags i{font:500 12px/1 var(--mono);font-style:normal;color:var(--ink-2);padding:4px 6px;background:var(--fill);border-radius:6px;white-space:nowrap}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) var(--panel);height:calc(100svh - var(--bar))}
.stage{position:relative;min-height:0;background:var(--stage);overflow:hidden;container-type:inline-size}
#cad-host{position:absolute;inset:0}
.cad-canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none;transition:opacity .5s ease}
.cad-canvas:active{cursor:grabbing}
.cad-canvas:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.stage[data-loading] .cad-canvas{opacity:0;pointer-events:none;transition-duration:.15s}
.stage[data-nogl] .stage-tools,.stage[data-nogl] .hint{display:none}

/* floating glass: toolbars, the title card, the hint */
.stage-tools,.views .seg,.tblock,.hint{background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);box-shadow:var(--shadow-2)}
.stage-tools{position:absolute;top:16px;right:16px;z-index:3;display:flex;gap:2px;padding:4px;border-radius:12px}
.tool{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;border:0;border-radius:8px;background:none;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.tool:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.tool[aria-pressed="true"]{background:var(--accent-tint);color:var(--accent-text)}
.tool svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.views{position:absolute;top:16px;left:16px;z-index:3}
.views:empty{display:none}
.views .seg{padding:4px;border-radius:12px}
.views .seg::before{top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n,1));border-radius:8px}
.views .seg button{min-height:34px;padding:0 14px;font-size:14px}

/* title card, bottom-left */
.tblock{position:absolute;left:16px;bottom:16px;z-index:2;display:flex;align-items:center;gap:14px;padding:10px 16px 10px 14px;border-radius:12px;max-width:min(540px,calc(100% - 32px));pointer-events:none}
.tblock .tb-code{font:600 20px/1 var(--mono);letter-spacing:-.01em;padding-right:14px;border-right:1px solid var(--rule-2);white-space:nowrap}
.tblock .tb-meta{display:grid;gap:2px;min-width:0}
.tblock .tb-type{font:500 13px/1.35 var(--mono);color:var(--ink);overflow-wrap:anywhere}
.tblock .tb-src{font-size:12.5px;line-height:1.35;color:var(--ink-3)}
.hint{position:absolute;right:16px;bottom:16px;z-index:2;margin:0;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-2);pointer-events:none;white-space:nowrap}
.hint:empty{display:none}

#cad-status{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;margin:0;font-size:14px;font-weight:500;color:var(--ink-2);pointer-events:none}
#cad-status:empty{display:none}
#cad-status[data-failed]{pointer-events:auto}
.bar-load{position:relative;width:200px;height:4px;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:4px;overflow:hidden}
.bar-load i{display:block;height:100%;background:var(--accent);border-radius:4px;transform-origin:left;transition:transform .25s var(--out)}
.bar-load::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shimmer 1.2s ease-in-out infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

/* balloons: numbered like an assembly drawing; the number matches the parts list */
.balloons{position:absolute;inset:0;z-index:2;pointer-events:none}
.balloon{position:absolute;left:0;top:0;display:grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border:0;border-radius:13px;background:var(--surface);box-shadow:0 0 0 1.5px var(--ink),0 4px 10px -4px rgba(0,0,0,.3);font:600 12px/1 var(--mono);color:var(--ink);transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;transition:opacity .2s,background-color .2s,box-shadow .2s;animation:pop .34s var(--spring) both}
.balloon[data-on]{background:var(--accent);color:#fff;box-shadow:0 0 0 1.5px var(--accent),0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent),0 6px 14px -4px rgba(37,99,235,.5);z-index:1}
.balloon[data-dim]{opacity:.35}
.balloon[hidden]{display:none}
@keyframes pop{from{scale:.3;opacity:0}}
.leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.leaders line{stroke:var(--ink-3);stroke-width:1}
.leaders circle{fill:var(--ink)}

/* side panel */
.panel{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--rule);background:var(--surface)}
.tabs{position:relative;display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--rule);flex:none}
.tab{position:relative;border:0;background:none;padding:0 10px;min-height:50px;font-size:14.5px;font-weight:500;color:var(--ink-3);cursor:pointer;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.tab-ink[data-still]{transition:none}
.tab-ink{position:absolute;left:0;bottom:-1px;height:2px;border-radius:2px;width:var(--w,0);background:var(--ink);transform:translateX(var(--x,0));transition:transform .32s var(--out),width .32s var(--out);pointer-events:none}
.tabpanel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 24px 48px}
.tabpanel[hidden]{display:none}
.tabpanel:not([hidden]){animation:panel-in .35s var(--out)}
/* language and theme changes: one soft cross-fade of the page; the language pill slides on its own */
::view-transition-old(root),::view-transition-new(root){animation-duration:.24s;animation-timing-function:ease}
#lang-group{view-transition-name:lang}
::view-transition-old(lang){display:none}
::view-transition-new(lang){animation:none}
@keyframes panel-in{from{opacity:0;transform:translateY(6px)}}
@keyframes fade-in{from{opacity:0}}
@keyframes rise-in{from{opacity:0;transform:translateY(8px)}}

.overview .sum{margin:0 0 18px;font-size:15px;line-height:1.65;color:var(--ink);text-wrap:pretty}
details summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-size:14.5px;font-weight:600}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";flex:none;width:7px;height:7px;margin-right:4px;border-right:1.6px solid var(--ink-3);border-bottom:1.6px solid var(--ink-3);transform:translateY(-2px) rotate(45deg);transition:transform .3s var(--out)}
details[open]>summary::after{transform:translateY(2px) rotate(225deg)}
details summary:hover::after{border-color:var(--ink)}
details::details-content{block-size:0;overflow:clip;transition:block-size .35s var(--out),content-visibility .35s allow-discrete}
details[open]::details-content{block-size:auto}
details.specs{border-top:1px solid var(--rule)}
details.specs+details.specs{border-top:1px solid var(--rule)}
details.specs:last-of-type{border-bottom:1px solid var(--rule);margin-bottom:8px}
dl{margin:0 0 14px;display:grid;gap:0}
dl div{display:grid;grid-template-columns:136px 1fr;gap:16px;padding:7px 0;font-size:14px;line-height:1.5}
dl div+div{border-top:1px solid var(--rule)}
dt{color:var(--ink-3)}
dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}

/* type code: the code on one line, then one row per segment; pointing at either marks both */
.code-help[hidden]{display:none}
#designation{padding:0 0 16px}
.code{margin:0 0 12px;font-size:17px;font-weight:600;letter-spacing:.01em;overflow-wrap:anywhere}
.code span{padding:1px 0;border-radius:4px;transition:background-color .2s,color .2s}
.code .sep{color:var(--ink-3);font-weight:500}
.code-rows{list-style:none;margin:0;padding:0}
.code-rows li{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;padding:6px 8px;margin:0 -8px;border-radius:8px;font-size:14px;line-height:1.5;transition:background-color .2s}
.code-rows b{font-weight:600;font-size:13.5px;color:var(--ink)}
.code-rows span{color:var(--ink-2)}
.code-rows li.on{background:var(--accent-tint)}
.code-rows li.on b{color:var(--accent-text)}
.code span.on{background:var(--accent-tint);color:var(--accent-text)}

/* bill of materials */
.bom-group{margin:22px 0 0}
.bom-head{display:flex;align-items:center;width:calc(100% + 16px);margin:0 -8px 2px;padding:6px 8px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;transition:background-color .15s}
.bom-head h3{margin:0;font-size:13px;font-weight:600;color:var(--ink-3);transition:color .15s}
.bom-head:hover h3,.bom-head[aria-pressed="true"] h3{color:var(--accent-text)}
.bom{list-style:none;margin:0;padding:0}
.bom li{scroll-margin:16px}
.part{display:grid;grid-template-columns:26px 1fr;align-items:center;gap:12px;width:calc(100% + 16px);min-height:40px;margin:0 -8px;padding:6px 8px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;font-size:15px;line-height:1.4;transition:background-color .15s}
.part:hover{background:var(--fill)}
.part .no{display:grid;place-items:center;width:26px;height:26px;border-radius:13px;background:var(--fill);font:600 12px/1 var(--mono);color:var(--ink-2);transition:background-color .2s,color .2s}
.part:hover .no{background:var(--surface);box-shadow:var(--shadow-1)}
.part[aria-expanded="true"]{background:var(--accent-tint)}
.part[aria-expanded="true"] .no{background:var(--accent);color:#fff;box-shadow:none}
.part[aria-expanded="true"] .nm{font-weight:600;color:var(--ink)}
.detail{padding:8px 0 18px 38px}
.detail[hidden]{display:none}
.detail .fn{margin:0;font-size:15px;line-height:1.65;color:var(--ink-2);text-wrap:pretty}
.detail .note{margin:12px 0 0;font-size:14px;color:var(--ink-2);line-height:1.6}
.detail .note::before{content:attr(data-label);display:block;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-3)}
.terms{margin:14px 0 0;padding:12px 14px;background:var(--fill);border-radius:10px;font-size:14px;line-height:1.55}
.terms dt{color:var(--ink);font-weight:600}
.terms dd{margin:2px 0 10px;color:var(--ink-2)}
.terms dd:last-child{margin-bottom:0}
.part-wait{padding:12px 0;color:var(--ink-3);font-size:14px}
details.about{margin-top:26px;border-top:1px solid var(--rule)}
details.about summary{font-size:14px;color:var(--ink-2)}
details.about p{margin:0 0 12px;font-size:13.5px;color:var(--ink-3);line-height:1.6}

/* how it works */
.primer{margin:0 0 16px;padding:0 16px;border-radius:12px;background:var(--fill)}
.primer summary{min-height:48px}
.primer ol{margin:0 0 12px;padding-left:20px;display:grid;gap:8px}
.primer li{font-size:14.5px;line-height:1.6;padding-left:2px;color:var(--ink-2)}
.primer li::marker{font:600 14px var(--sans);color:var(--ink-3);font-variant-numeric:tabular-nums}
.primer-read{margin:0 0 14px;padding-top:12px;border-top:1px solid var(--rule-2);font-size:14px;color:var(--ink-2);line-height:1.6}
.how-intro{margin:0 0 16px;font-size:15px;color:var(--ink-2);line-height:1.65;text-wrap:pretty}

/* circuit: blue = current from N, orange = current from N+1; both at once = bridged */
:root{--cn:var(--accent);--cm:#c8640f;--wire:var(--ink-3)}
:root[data-theme="dark"]{--cm:#f0a25a}
.c-card{margin:0 0 14px;border-radius:12px;background:var(--stage);box-shadow:var(--shadow-1);overflow:hidden}
.c-host{padding:12px 10px 4px}
.c-svg{display:block;width:100%;height:auto;max-height:340px;font-family:var(--mono)}
.c-w{fill:none;stroke:var(--wire);stroke-width:1.6;stroke-linecap:round;transition:stroke .3s}
.c-rail-n,.c-rail-m{stroke-width:2.4}
.c-dot,.c-pad,.c-pivot{fill:var(--wire);transition:fill .3s}
.c-pad{fill:var(--surface);stroke:var(--wire);stroke-width:1.4}
.c-vi{fill:var(--surface);stroke:var(--wire);stroke-width:1.4;transition:stroke .3s,fill .3s}
.c-res,.c-coil{fill:var(--surface);stroke:var(--wire);stroke-width:1.4;transition:stroke .3s,fill .3s}
.c-coil{fill:none}
.c-blade{stroke-width:2.2;transform-box:view-box;transition:transform .5s cubic-bezier(.5,0,.2,1),stroke .3s}
.c-vi-move{transition:transform .35s cubic-bezier(.5,0,.2,1),stroke .3s}
.c-vi-move.is-open{transform:translateY(7px)}
.c-lbl{font-size:11.5px;font-weight:600;fill:var(--ink-2)}
.c-name{fill:var(--ink)}
.c-side{font-size:12.5px;font-weight:600;fill:var(--ink-3);transition:fill .3s}
.c-arrow{fill:none;stroke:var(--wire);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.c-load{font-weight:500;fill:var(--ink-3)}
/* lit paths */
.c-svg[data-n="1"] .c-rail-n,.c-br[data-carry="n"] .c-d-N,.c-br[data-carry="n"] .c-c{stroke:var(--cn)}
.c-svg[data-m="1"] .c-rail-m,.c-br[data-carry="m"] .c-d-M,.c-br[data-carry="m"] .c-c{stroke:var(--cm)}
.c-svg[data-n="1"] .c-side-n{fill:var(--cn)}
.c-svg[data-m="1"] .c-side-m{fill:var(--cm)}
.c-br[data-carry="n"] .c-pivot{fill:var(--cn)}
.c-br[data-carry="m"] .c-pivot{fill:var(--cm)}
.c-br[data-carry="n"] .c-vi,.c-br[data-carry="n"] .c-res.c-c,.c-br[data-carry="n"] .c-coil,.c-br[data-carry="n"] .c-res.c-d-N{stroke:var(--cn)}
.c-br[data-carry="m"] .c-vi,.c-br[data-carry="m"] .c-res.c-c,.c-br[data-carry="m"] .c-coil,.c-br[data-carry="m"] .c-res.c-d-M{stroke:var(--cm)}
.c-svg[data-src="b"] .c-br[data-carry] .c-res.c-c,.c-svg[data-src="b"] .c-br[data-carry="n"] .c-res.c-d-N,.c-svg[data-src="b"] .c-br[data-carry="m"] .c-res.c-d-M{fill:color-mix(in srgb,var(--cm) 22%,var(--surface))}
.c-svg[data-src="n"] .c-bus,.c-svg[data-src="n"] .c-out,.c-svg[data-src="n"] .c-arrow{stroke:var(--cn)}
.c-svg[data-src="m"] .c-bus,.c-svg[data-src="m"] .c-out,.c-svg[data-src="m"] .c-arrow{stroke:var(--cm)}
.c-svg[data-src="b"] .c-bus,.c-svg[data-src="b"] .c-out,.c-svg[data-src="b"] .c-arrow{stroke:var(--ink)}
.c-br[data-carry] .c-flow{stroke-dasharray:6 4;animation:c-flow .7s linear infinite}
.c-svg .c-out{stroke-dasharray:6 4;animation:c-flow .7s linear infinite}
.c-svg[data-src=""] .c-out{animation:none;stroke-dasharray:none}
@keyframes c-flow{to{stroke-dashoffset:-10}}
.c-instant *{transition:none!important}
.c-card figcaption{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;padding:10px 14px;border-top:1px solid var(--rule);background:var(--surface)}
.c-status{font-size:14px;font-weight:600}
.c-status[data-src="n"]{color:var(--cn)}
.c-status[data-src="m"]{color:var(--cm)}
.c-legend{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.c-legend i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-left:8px}
.lg-n{background:var(--cn)}
.lg-m{background:var(--cm)}
.c-key{margin:0;padding:10px 14px 12px;border-top:1px solid var(--rule);background:var(--surface);font-size:13.5px;line-height:1.6;color:var(--ink-2)}

/* step controls and the current step */
.step-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.step-dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:15px;background:var(--fill);font:600 12px/1 var(--mono);color:var(--ink-2);cursor:pointer}
.dot:hover{background:var(--fill-2);color:var(--ink)}
.dot[aria-current="true"]{background:var(--accent);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.step-ctrls{display:flex;gap:4px;flex:none}
.step-ctrls .icon{background:var(--fill)}
.step-ctrls .icon:hover{background:var(--fill-2)}
.step-ctrls .icon:disabled{opacity:.4;cursor:default}
.step-ctrls .icon.primary{background:var(--ink);color:var(--surface)}
.ic-play{fill:currentColor;stroke:none}
.ic-pause{display:none}
[data-play][data-on] .ic-play{display:none}
[data-play][data-on] .ic-pause{display:inline}
.step-now{padding:16px 18px;border-radius:12px;background:var(--fill);margin:0 0 16px}
.step-count{margin:0;font:600 12px/1.4 var(--mono);color:var(--ink-3);letter-spacing:.02em}
.step-now h3{margin:4px 0 6px;font-size:17px;line-height:1.35;letter-spacing:-.01em}
.step-text{margin:0;font-size:15px;line-height:1.65;color:var(--ink-2)}
.why{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule-2)}
.why b{display:block;font-size:13px;color:var(--ink-3);margin-bottom:6px}
.why ul{margin:0;padding-left:18px;display:grid;gap:6px}
.why li{font-size:14px;line-height:1.6;color:var(--ink-2)}
.all-steps{border-top:1px solid var(--rule)}
.steps{list-style:none;margin:0;padding:0 0 8px;counter-reset:step}
.step{counter-increment:step}
.step-btn{display:grid;grid-template-columns:26px 1fr;gap:12px;width:calc(100% + 16px);margin:0 -8px;padding:10px 8px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;transition:background-color .15s}
.step-btn:hover{background:var(--fill)}
.step-btn::before{content:counter(step);display:grid;place-items:center;width:26px;height:26px;border-radius:13px;background:var(--fill);font:600 12px/1 var(--mono);color:var(--ink-2)}
.step-btn[aria-current="true"]{background:var(--accent-tint)}
.step-btn[aria-current="true"]::before{background:var(--accent);color:#fff}
.step b{display:block;font-size:14.5px;margin-bottom:2px}
.step p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:9px;border:0;background:var(--fill);cursor:pointer;font-size:14.5px;font-weight:500}
.btn:hover{background:var(--fill-2)}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 86%,var(--surface))}
.btn:disabled{opacity:.45;cursor:default}

/* self-test */
.quiz-modes{display:inline-grid;margin-bottom:20px}
.quiz-q{font-size:17px;font-weight:600;line-height:1.45;margin:0 0 14px;letter-spacing:-.01em;text-wrap:pretty}
.quiz-meta{font:500 13px var(--mono);color:var(--ink-3);margin:0 0 6px}
.quiz-opts{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.opt{width:100%;text-align:left;border:0;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--rule-2);padding:12px 14px;cursor:pointer;font-size:15px;line-height:1.45}
.opt:hover:not(:disabled){background:var(--fill)}
.opt:disabled{cursor:default}
.opt[data-state="right"]{background:var(--ok-tint);box-shadow:inset 0 0 0 1.5px var(--ok)}
.opt[data-state="wrong"]{background:var(--bad-tint);box-shadow:inset 0 0 0 1.5px var(--bad)}
.opt[aria-pressed="true"]:not([data-state]){background:var(--accent-tint);box-shadow:inset 0 0 0 1.5px var(--accent)}
.verdict{margin:0 0 14px;font-size:15px;line-height:1.6;color:var(--ink-2)}
.verdict b{color:var(--ok)}
.verdict b.no{color:var(--bad)}
.find-target{margin:6px 0 14px;font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.015em}
.empty-note{color:var(--ink-3);font-size:14.5px}
.quiz-q:focus,.find-target:focus{outline:none}

/* a narrow model area: tool labels fold to icons, the hint and then the title card step aside */
.stage[data-compact] .tool .lbl{display:none}
.stage[data-compact] .tool{padding:0 9px}
.stage[data-nohint] .hint{display:none}
@container (max-width:520px){.tblock{display:none}}

/* phone and narrow tablet: the model stays pinned on top, the panel scrolls under it */
@media (max-width:1100px){.fam-group ul{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:860px){
  :root{--bar:52px}
  body{height:auto}
  .bar{position:sticky;top:0;padding:0 8px 0 12px;gap:8px}
  .brand{display:none}
  .fam-btn{max-width:none;flex:1;min-width:0}
  .seg button{padding:0 9px}
  .layout{display:block;height:auto}
  :root{--stage-h:max(46svh,260px)}
  :root[data-panel="how"]{--stage-h:max(30svh,190px)}
  .stage{position:sticky;top:var(--bar);z-index:4;height:var(--stage-h);border-bottom:1px solid var(--rule);transition:height .3s ease}
  .panel{border-left:0;min-height:calc(100svh - var(--bar) - var(--stage-h))}
  .tabs{position:sticky;top:calc(var(--bar) + var(--stage-h));z-index:3;background:var(--surface);padding:0 10px}
  .tabpanel{overflow:visible;padding:18px 16px 48px}
  .bom li,.c-card,.step-bar{scroll-margin-top:calc(var(--bar) + var(--stage-h) + 56px)}
  .tblock{display:none}
  .stage-tools{top:10px;right:10px;padding:3px}
  .tool .lbl{display:none}
  .tool{padding:0 9px}
  .hint{display:none}
  .views{top:auto;bottom:10px;left:10px}
  .views .seg{padding:3px;border-radius:10px}
  .views .seg::before{top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n,1));border-radius:7px}
  .views .seg button{min-height:30px;padding:0 12px;font-size:13.5px}
  #fam-dlg{margin:0;width:100vw;max-width:100vw;max-height:88svh;inset:auto 0 0 0;border-radius:18px 18px 0 0}
  #fam-dlg[open]{animation:rise .3s var(--out)}
  .fam-grid{padding:0 16px 24px}
  .fam-pic{height:116px}
  .fam-group ul{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  dl div{grid-template-columns:120px 1fr}
}
@keyframes rise{from{transform:translateY(40px);opacity:.5}}
@media (max-width:420px){.fam-btn span{display:none}.fam-btn{justify-content:space-between}}
@media (max-width:400px){.seg button{padding:0 7px;font-size:13px;min-width:34px}.icon{width:34px}}
@media (pointer:coarse){.part{min-height:46px}.tool{height:38px}.seg button{min-height:34px}.icon{height:40px;width:40px}.balloon{min-width:30px;height:30px;border-radius:15px}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{
  .bar-tools,.stage-tools,.tabs,.hint,.balloons,#fam-dlg,.skip{display:none!important}
  body,.layout{height:auto;display:block;background:#fff}
  .stage{height:420px;position:relative;break-after:avoid}
  .panel{border:0}
  .tabpanel{overflow:visible}
  .detail[hidden]{display:block}
}
