.c-br[data-carry="m"] .c-pivot{fill:var(--cm)}
.c-br[data-carry="n"] .c-vi,.c-br[data-carry="n"] .c-res.c-c,.c-br[data-carry="n"] .c-coil,.c-br[data-carry="n"] .c-res.c-d-N{stroke:var(--cn)}
.c-br[data-carry="m"] .c-vi,.c-br[data-carry="m"] .c-res.c-c,.c-br[data-carry="m"] .c-coil,.c-br[data-carry="m"] .c-res.c-d-M{stroke:var(--cm)}
.c-svg[data-src="b"] .c-br[data-carry] .c-res.c-c,.c-svg[data-src="b"] .c-br[data-carry="n"] .c-res.c-d-N,.c-svg[data-src="b"] .c-br[data-carry="m"] .c-res.c-d-M{fill:color-mix(in srgb,var(--cm) 22%,var(--surface))}
.c-svg[data-src="n"] .c-bus,.c-svg[data-src="n"] .c-out,.c-svg[data-src="n"] .c-arrow{stroke:var(--cn)}
.c-svg[data-src="m"] .c-bus,.c-svg[data-src="m"] .c-out,.c-svg[data-src="m"] .c-arrow{stroke:var(--cm)}
.c-svg[data-src="b"] .c-bus,.c-svg[data-src="b"] .c-out,.c-svg[data-src="b"] .c-arrow{stroke:var(--ink)}
.c-br[data-carry] .c-flow{stroke-dasharray:6 4;animation:c-flow .7s linear infinite}
.c-svg .c-out{stroke-dasharray:6 4;animation:c-flow .7s linear infinite}
.c-svg[data-src=""] .c-out{animation:none;stroke-dasharray:none}
@keyframes c-flow{to{stroke-dashoffset:-10}}
.c-instant *{transition:none!important}
.c-card figcaption{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;padding:8px 12px;border-top:1px solid var(--rule);background:var(--surface)}
.c-status{font-size:13px;font-weight:600}
.c-status[data-src="n"]{color:var(--cn)}
.c-status[data-src="m"]{color:var(--cm)}
.c-legend{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
.c-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-left:6px}
.lg-n{background:var(--cn)}
.lg-m{background:var(--cm)}
.c-key{margin:0;padding:8px 12px 10px;border-top:1px solid var(--rule);background:var(--surface);font-size:12px;line-height:1.55;color:var(--ink-2)}

/* step controls and the current step */
.step-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.step-dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{display:grid;place-items:center;width:26px;height:26px;border-radius:13px;border:1.25px solid var(--rule-2);background:var(--surface);font:600 11px/1 var(--mono);color:var(--ink-3);cursor:pointer;transition:background-color .2s,border-color .2s,color .2s,transform .2s}
.dot:hover{border-color:var(--ink-3);color:var(--ink)}
.dot[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(1.08)}
.step-ctrls{display:flex;gap:6px;flex:none}
.step-ctrls .icon:disabled{opacity:.4;cursor:default}
.step-ctrls .icon.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ic-play{fill:currentColor;stroke:none}
.ic-pause{display:none}
[data-play][data-on] .ic-play{display:none}
[data-play][data-on] .ic-pause{display:inline}
.step-now{padding:12px 14px;border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:var(--radius);background:var(--surface);margin:0 0 14px;animation:fade-in .25s ease}
.step-count{margin:0;font:600 11px/1.4 var(--mono);color:var(--ink-3);letter-spacing:.02em}
.step-now h3{margin:2px 0 6px;font-size:16px}
.step-text{margin:0;font-size:14px;line-height:1.7}
.why{margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule-2)}
.why b{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px}
.why ul{margin:0;padding-left:18px;display:grid;gap:5px}
.why li{font-size:13px;line-height:1.6;color:var(--ink-2)}
.all-steps{border-top:1px solid var(--rule)}
.steps{list-style:none;margin:0;padding:0;counter-reset:step}
.step{counter-increment:step;border-bottom:1px solid var(--rule)}
.step:last-child{border-bottom:0}
.step-btn{display:grid;grid-template-columns:30px 1fr;gap:8px;width:100%;padding:10px 0;border:0;background:none;text-align:left;cursor:pointer}
.step-btn::before{content:counter(step);display:grid;place-items:center;width:24px;height:24px;border-radius:12px;border:1.25px solid var(--ink-3);font:600 11px/1 var(--mono);color:var(--ink-2)}
.step-btn[aria-current="true"]::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step b{display:block;font-size:14px;margin-bottom:2px}
.step p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:var(--radius);border:1px solid var(--rule-2);background:var(--surface);cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* self-test */
.quiz-modes{display:flex;gap:8px;margin-bottom:16px}
.quiz-q{font-size:15px;font-weight:600;margin:0 0 4px}
.quiz-meta{font:12.5px var(--mono);color:var(--ink-3);margin:0 0 12px}
.quiz-opts{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.opt{width:100%;text-align:left;border:1px solid var(--rule-2);border-radius:var(--radius);background:var(--surface);padding:9px 12px;cursor:pointer;font-size:14px;line-height:1.45}
.opt:hover{border-color:var(--ink-3)}
.opt[data-state="right"]{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt[data-state="wrong"]{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.opt[aria-pressed="true"]:not([data-state]){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.verdict{margin:0 0 12px;font-size:14px;line-height:1.6}
.verdict b{color:var(--ok)}
.verdict b.no{color:var(--bad)}
.find-target{margin:0 0 6px;font-size:20px;font-weight:600}
.empty-note{color:var(--ink-3);font-size:13.5px}

/* phone and narrow tablet: the model stays pinned on top, the panel scrolls under it */
@media (max-width:860px){
  :root{--bar:52px}
  body{height:auto}
  .bar{position:sticky;top:0;padding:0 10px 0 14px;gap:10px}
  .brand{display:none}
  .fam-btn{max-width:none;flex:1;min-width:0}
  .seg button{padding:0 9px}
  .layout{display:block;height:auto}
  :root{--stage-h:max(46svh,260px)}
  :root[data-panel="how"]{--stage-h:max(30svh,190px)}
  .stage{position:sticky;top:var(--bar);z-index:4;height:var(--stage-h);border-bottom:1px solid var(--rule);transition:height .3s ease}
  .panel{border-left:0;min-height:calc(100svh - var(--bar) - var(--stage-h))}
  .tabs{position:sticky;top:calc(var(--bar) + var(--stage-h));z-index:3;background:var(--surface);padding:0 8px}
  .tabpanel{overflow:visible;padding:16px 16px 40px}
  .bom li,.c-card,.step-bar{scroll-margin-top:calc(var(--bar) + var(--stage-h) + 56px)}
  .tblock{display:none}
  .stage-tools{top:10px;right:10px}
  .tool .lbl{display:none}
  .tool{padding:0 9px}
  .hint{display:none}
  .views{top:auto;bottom:10px;left:10px}
  #fam-dlg{margin:0;width:100vw;max-width:100vw;max-height:88svh;inset:auto 0 0 0;border-radius:14px 14px 0 0}
  #fam-dlg[open]{animation:rise .22s cubic-bezier(.2,.8,.2,1)}
  .fam-grid{padding:4px 16px 24px}
  .fam-group-head{grid-template-columns:1fr}
  .fam-group ul{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@keyframes rise{from{transform:translateY(24px);opacity:.6}}
@media (max-width:400px){.seg button{padding:0 7px;font-size:12.5px;min-width:34px}.icon{width:34px}.fam-group ul{grid-template-columns:1fr}}
@media (pointer:coarse){.part{min-height:46px}.tool,.icon{min-height:40px}.seg button{min-height:36px}.icon{height:40px;width:40px}.balloon{min-width:28px;height:28px;border-radius:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{
  .bar-tools,.stage-tools,.tabs,.hint,.balloons,#fam-dlg,.skip{display:none!important}
  body,.layout{height:auto;display:block;background:#fff}
  .stage{height:420px;position:relative;break-after:avoid}
  .panel{border:0}
  .tabpanel{overflow:visible}
  .detail[hidden]{display:block}
}
